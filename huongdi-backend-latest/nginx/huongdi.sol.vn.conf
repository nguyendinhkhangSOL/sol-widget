# ============================================================
# HUONGDI.SOL.VN — Nginx vhost
# Copy to: /etc/nginx/sites-available/huongdi.sol.vn
# Enable: ln -s /etc/nginx/sites-available/huongdi.sol.vn /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d huongdi.sol.vn
# ============================================================

server {
    listen 80;
    server_name huongdi.sol.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name huongdi.sol.vn;

    # SSL — managed by Certbot
    ssl_certificate /etc/letsencrypt/live/huongdi.sol.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huongdi.sol.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/huongdi/public;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # API proxy → huongdi-api:4001
    location /api/ {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Static files (HTML/CSS/JS)
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Long cache for assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
