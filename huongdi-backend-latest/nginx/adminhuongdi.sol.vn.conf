# ============================================================
# ADMINHUONGDI.SOL.VN — Nginx vhost
# Copy to: /etc/nginx/sites-available/adminhuongdi.sol.vn
# SSL: certbot --nginx -d adminhuongdi.sol.vn
# Optional: IP whitelist — chỉ cho IP văn phòng/VPN truy cập
# ============================================================

server {
    listen 80;
    server_name adminhuongdi.sol.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name adminhuongdi.sol.vn;

    ssl_certificate /etc/letsencrypt/live/adminhuongdi.sol.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adminhuongdi.sol.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/huongdi/admin/dist;
    index index.html;

    # ── Optional: IP Whitelist ────────────────────────────────
    # Uncomment and set your office/VPN IP:
    # allow 123.456.789.0/24;
    # deny all;
    # ─────────────────────────────────────────────────────────

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # API proxy → same huongdi-api:4001
    location /api/ {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
