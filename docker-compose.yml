version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sol
      POSTGRES_USER: sol
      POSTGRES_PASSWORD: sol_dev_pwd
    ports:
      - '5432:5432'
    volumes:
      - sol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sol -d sol']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://sol:sol_dev_pwd@db:5432/sol
      PORT: '4000'
      # FIX (Sol v3): set locale UTF-8 để Node.js parse string tiếng Việt
      # đúng. Mặc định container Linux có LANG=C → strip multi-byte chars.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE: http://localhost:4000
    ports:
      - '5173:5173'

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE: http://localhost:4000
      # CI=true để Vite skip stdin keyboard shortcuts handler.
      # Combined với redirect stdin null trong Dockerfile CMD → Vite không exit.
      CI: 'true'
    ports:
      - '5174:5174'
    # Phòng khi CI=true chưa đủ, allocate pseudo-TTY.
    tty: true
    stdin_open: true

volumes:
  sol_pgdata:
