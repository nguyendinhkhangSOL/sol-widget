<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Hành Trình 90 ngày — Sol La Bàn</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --amber:#F59E0B; --amber-light:#FEF3C7; --amber-dark:#B45309;
    --navy:#0F172A; --navy-2:#1E293B; --slate:#64748B; --slate-light:#94A3B8;
    --border:#E2E8F0; --bg:#F8FAFC; --white:#FFFFFF;
    --success:#16A34A; --danger:#DC2626; --purple:#8B5CF6;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter', 'Segoe UI', -apple-system, sans-serif; background:var(--bg); color:var(--navy); line-height:1.6; }

  .top-bar { background:var(--white); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
  .top-bar a { color:var(--navy); text-decoration:none; font-size:14px; }
  .container { max-width:900px; margin:0 auto; padding:24px; }

  h1 { font-size:28px; font-weight:800; margin-bottom:4px; }
  .subtitle { color:var(--slate); font-size:14px; margin-bottom:24px; }

  /* Direction header */
  .direction-header {
    background:linear-gradient(135deg, var(--amber-light), #FDE68A);
    border-left:5px solid var(--amber); border-radius:12px;
    padding:20px 24px; margin-bottom:24px;
  }
  .dir-label { font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--amber-dark); font-weight:700; }
  .dir-name { font-size:22px; font-weight:800; color:var(--navy); margin-top:4px; }
  .dir-meta { font-size:13px; color:var(--amber-dark); margin-top:4px; }

  /* Progress */
  .progress-card { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:20px 24px; margin-bottom:20px; }
  .progress-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .progress-day { font-size:32px; font-weight:800; color:var(--amber); }
  .progress-day small { font-size:14px; color:var(--slate); font-weight:400; }
  .progress-phase { padding:6px 16px; border-radius:999px; background:var(--navy); color:var(--amber); font-size:13px; font-weight:700; }
  .progress-bar { height:12px; background:var(--bg); border-radius:999px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg, var(--amber), var(--amber-dark)); border-radius:999px; transition:width 0.6s; }
  .progress-stats { display:flex; gap:20px; margin-top:12px; font-size:13px; color:var(--slate); }
  .stat strong { color:var(--navy); font-weight:700; font-size:15px; }

  /* Timeline 3 phase */
  .phase-tabs { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:16px; }
  .phase-tab {
    padding:14px 12px; background:var(--white); border:2px solid var(--border);
    border-radius:10px; cursor:pointer; text-align:center; transition:all 0.15s;
  }
  .phase-tab.active { background:var(--navy); border-color:var(--navy); color:white; }
  .phase-tab .p-day { font-size:12px; color:var(--slate); font-weight:600; }
  .phase-tab.active .p-day { color:var(--amber); }
  .phase-tab .p-title { font-size:14px; font-weight:700; margin-top:4px; color:var(--navy); }
  .phase-tab.active .p-title { color:white; }
  .phase-tab .p-count { font-size:11px; color:var(--slate); margin-top:4px; }
  .phase-tab.active .p-count { color:var(--slate-light); }

  /* Milestones list */
  .milestones { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
  .milestone {
    background:var(--white); border:1px solid var(--border); border-radius:8px;
    padding:14px 16px; display:flex; gap:14px; align-items:center;
    cursor:pointer; transition:all 0.15s;
  }
  .milestone:hover { border-color:var(--amber); }
  .milestone.done { background:#F0FDF4; border-color:var(--success); }
  .milestone.today { border-color:var(--amber); background:#FFFBEB; box-shadow:0 0 0 3px rgba(245,158,11,0.1); }
  .milestone-day { flex:0 0 40px; height:40px; background:var(--bg); border-radius:8px; text-align:center; line-height:40px; font-size:13px; font-weight:700; color:var(--slate); }
  .milestone.done .milestone-day { background:var(--success); color:white; }
  .milestone.today .milestone-day { background:var(--amber); color:white; }
  .milestone-body { flex:1; }
  .milestone-title { font-size:14px; font-weight:600; color:var(--navy); }
  .milestone.done .milestone-title { text-decoration:line-through; color:var(--slate); }
  .milestone-desc { font-size:12px; color:var(--slate); margin-top:2px; }
  .milestone-check { flex:0 0 24px; font-size:20px; color:var(--slate); }
  .milestone.done .milestone-check { color:var(--success); }

  /* Journal form */
  .journal-form {
    background:linear-gradient(135deg, var(--navy), var(--navy-2)); color:white;
    border-radius:12px; padding:24px; margin-bottom:24px;
  }
  .journal-form h3 { color:var(--amber); font-size:16px; margin-bottom:12px; font-weight:700; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; margin-bottom:6px; color:var(--slate-light); font-weight:500; }
  .field textarea, .field input {
    width:100%; padding:10px 12px; border:1px solid rgba(255,255,255,0.15);
    border-radius:6px; font-size:14px; font-family:inherit; background:rgba(255,255,255,0.05); color:white;
  }
  .field textarea:focus, .field input:focus { outline:none; border-color:var(--amber); background:rgba(255,255,255,0.1); }
  .field textarea { min-height:80px; resize:vertical; }
  .mood-row { display:flex; gap:8px; }
  .mood-btn {
    flex:1; padding:10px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15);
    border-radius:6px; font-size:20px; cursor:pointer; color:white;
  }
  .mood-btn.active { background:var(--amber); border-color:var(--amber); }

  .btn-save { background:var(--amber); color:var(--navy); border:none; padding:12px 24px; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; width:100%; }
  .btn-save:hover { opacity:0.9; }

  /* Recent entries */
  .recent-block { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:20px 24px; }
  .recent-block h3 { font-size:16px; margin-bottom:12px; }
  .entry { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .entry:last-child { border:none; }
  .entry-day { flex:0 0 40px; height:40px; background:var(--bg); border-radius:8px; text-align:center; line-height:40px; font-size:13px; font-weight:700; color:var(--amber-dark); }
  .entry-body { flex:1; font-size:13px; color:var(--slate); line-height:1.5; }
  .entry-body strong { color:var(--navy); }
  .entry-mood { font-size:18px; }

  /* Empty state */
  .empty { text-align:center; padding:60px 20px; }
  .empty h2 { font-size:22px; margin-bottom:12px; }
  .empty p { color:var(--slate); margin-bottom:20px; }
  .btn-primary { display:inline-block; background:var(--amber); color:var(--navy); padding:14px 32px; border-radius:8px; font-weight:700; text-decoration:none; }

  /* Loading skeleton */
  .skel { background:linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size:200% 100%; animation:skel 1.4s infinite; border-radius:8px; height:20px; }
  @keyframes skel { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
</style>
</head>
<body>

<div class="top-bar">
  <a href="/toi/">← Về dashboard</a>
  <span id="tierBadge" style="font-size:13px; color:var(--slate);">─</span>
</div>

<div class="container">
  <h1>📓 Sổ Hành Trình 90 Ngày</h1>
  <p class="subtitle">Ghi lại tiến độ, wins, blockers mỗi ngày. Milestone check-in định kỳ. Xuất PDF sau 90 ngày.</p>

  <div id="main">
    <div class="skel" style="height:100px; margin-bottom:16px;"></div>
    <div class="skel" style="height:150px;"></div>
  </div>
</div>

<script>
(function() {
  const API_BASE = window.SOL_API_BASE || 'https://huongdi.sol.vn/api';
  const jwt = localStorage.getItem('sol_jwt');
  const user = (() => { try { return JSON.parse(localStorage.getItem('sol_user') || 'null'); } catch { return null; } })();

  if (!jwt) { location.href = '/dang-nhap/'; return; }

  document.getElementById('tierBadge').textContent = user?.displayName + ' · ' + user?.tier;

  let currentPhase = 'D30';
  let stateData = null;

  fetch(API_BASE + '/journey/state', { headers: { 'Authorization': 'Bearer ' + jwt } })
    .then(r => r.json())
    .then(data => {
      if (!data.success) throw new Error(data.message);
      stateData = data;
      if (data.state === 'NO_DIRECTION') renderEmpty();
      else render(data);
    })
    .catch(err => {
      console.error(err);
      document.getElementById('main').innerHTML = `<div class="empty"><h2>Không load được</h2><p>${err.message}</p></div>`;
    });

  function renderEmpty() {
    document.getElementById('main').innerHTML = `
      <div class="empty">
        <h2>🎯 Chưa chọn hướng đi</h2>
        <p>Hoàn thành Bước 3 và chọn 1 hướng đi để bắt đầu Sổ Hành Trình 90 ngày.</p>
        <a href="/la-ban-huong-di/" class="btn-primary">Đi tới Bước 3</a>
      </div>
    `;
  }

  function render(d) {
    // Determine current phase to focus
    currentPhase = d.progress.phase;

    document.getElementById('main').innerHTML = `
      <!-- Direction header -->
      <div class="direction-header">
        <div class="dir-label">HƯỚNG ĐI ĐANG THEO ĐUỔI</div>
        <div class="dir-name">${d.direction.name || 'Direction'}</div>
        <div class="dir-meta">Bắt đầu ${new Date(d.direction.startedAt).toLocaleDateString('vi-VN')} · ${d.progress.daysRemaining} ngày còn lại</div>
      </div>

      <!-- Progress card -->
      <div class="progress-card">
        <div class="progress-row">
          <div class="progress-day">Ngày ${d.progress.currentDay} <small>/ 90</small></div>
          <div class="progress-phase">${d.progress.phase}</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${d.progress.progressPercent}%"></div></div>
        <div class="progress-stats">
          <div class="stat"><strong>${d.progress.progressPercent}%</strong> hoàn thành</div>
          <div class="stat"><strong>${d.progress.daysLogged}</strong> ngày đã log</div>
          <div class="stat"><strong>${d.progress.daysRemaining}</strong> ngày còn lại</div>
        </div>
      </div>

      <!-- Phase tabs -->
      <div class="phase-tabs">
        ${['D30','D60','D90'].map(p => {
          const info = d.milestonesByPhase[p];
          const doneCount = info.milestones.filter(m => m.isDone).length;
          const isActive = p === currentPhase ? 'active' : '';
          return `<div class="phase-tab ${isActive}" data-phase="${p}">
            <div class="p-day">${info.dayRange}</div>
            <div class="p-title">${info.title}</div>
            <div class="p-count">${doneCount}/${info.milestones.length} milestones</div>
          </div>`;
        }).join('')}
      </div>

      <!-- Milestones -->
      <div class="milestones" id="milestonesList"></div>

      <!-- Journal form -->
      <div class="journal-form">
        <h3>✍️ Log ngày ${d.progress.currentDay}</h3>
        <div class="field">
          <label>Hôm nay bạn làm gì?</label>
          <textarea id="jContent" placeholder="Chia sẻ ngắn về hoạt động chính, cảm nhận, học được gì...">${d.todayEntry?.journalContent || ''}</textarea>
        </div>
        <div class="field">
          <label>🎉 Wins (mỗi win 1 dòng)</label>
          <textarea id="jWins" placeholder="Ví dụ: Gửi cold email 5 người, có 2 người reply">${(d.todayEntry?.wins || []).join('\n')}</textarea>
        </div>
        <div class="field">
          <label>🚧 Blockers (mỗi cái 1 dòng)</label>
          <textarea id="jBlockers" placeholder="Ví dụ: Chưa biết cách viết proposal, cần tìm tài liệu">${(d.todayEntry?.blockers || []).join('\n')}</textarea>
        </div>
        <div class="field">
          <label>Mood hôm nay:</label>
          <div class="mood-row" id="moodRow">
            ${[1,2,3,4,5].map(m => `<button class="mood-btn ${d.todayEntry?.mood === m ? 'active' : ''}" data-mood="${m}">${['😰','😔','😐','🙂','🚀'][m-1]}</button>`).join('')}
          </div>
        </div>
        <button class="btn-save" onclick="saveEntry()">💾 Lưu vào Sổ</button>
      </div>

      <!-- Recent entries -->
      <div class="recent-block">
        <h3>Các entry gần đây</h3>
        ${d.recentEntries.length === 0
          ? '<p style="color:var(--slate); text-align:center; padding:20px;">Chưa có entry nào — bắt đầu log ngày hôm nay!</p>'
          : d.recentEntries.map(e => `
            <div class="entry">
              <div class="entry-day">D${e.day}</div>
              <div class="entry-body">${e.journalContent ? `<strong>${e.journalContent.substring(0, 100)}${e.journalContent.length > 100 ? '...' : ''}</strong>` : '<em>Chưa có nội dung</em>'}
                <div style="font-size:11px; color:var(--slate-light); margin-top:4px;">${new Date(e.updatedAt || e.createdAt).toLocaleDateString('vi-VN')}</div>
              </div>
              <div class="entry-mood">${e.mood ? ['😰','😔','😐','🙂','🚀'][e.mood-1] : ''}</div>
            </div>
          `).join('')}
      </div>
    `;

    // Attach phase tab handlers
    document.querySelectorAll('.phase-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        currentPhase = tab.dataset.phase;
        document.querySelectorAll('.phase-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderMilestones();
      });
    });

    // Mood button handlers
    document.querySelectorAll('.mood-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    renderMilestones();
  }

  function renderMilestones() {
    if (!stateData) return;
    const phaseInfo = stateData.milestonesByPhase[currentPhase];
    const currentDay = stateData.progress.currentDay;

    document.getElementById('milestonesList').innerHTML = phaseInfo.milestones.map(m => {
      const isDone = m.isDone;
      const isToday = m.day === currentDay;
      const isPast = m.day < currentDay;

      return `<div class="milestone ${isDone ? 'done' : ''} ${isToday ? 'today' : ''}" onclick="jumpToDay(${m.day})">
        <div class="milestone-day">D${m.day}</div>
        <div class="milestone-body">
          <div class="milestone-title">${m.title}</div>
          <div class="milestone-desc">${m.description}</div>
        </div>
        <div class="milestone-check">${isDone ? '✅' : isToday ? '📍' : isPast ? '⏰' : '○'}</div>
      </div>`;
    }).join('');
  }

  window.jumpToDay = function(day) {
    // TODO: có thể mở modal edit day cụ thể — for now scroll to journal form
    document.querySelector('.journal-form')?.scrollIntoView({ behavior: 'smooth' });
  };

  window.saveEntry = async function() {
    const content = document.getElementById('jContent').value.trim();
    const wins = document.getElementById('jWins').value.trim().split('\n').filter(w => w);
    const blockers = document.getElementById('jBlockers').value.trim().split('\n').filter(b => b);
    const moodBtn = document.querySelector('.mood-btn.active');
    const mood = moodBtn ? parseInt(moodBtn.dataset.mood) : null;

    if (!content && wins.length === 0 && blockers.length === 0) {
      return alert('Điền ít nhất 1 field trước khi lưu');
    }

    const res = await fetch(API_BASE + '/journey/day', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jwt },
      body: JSON.stringify({
        day: stateData.progress.currentDay,
        journalContent: content,
        wins, blockers, mood,
      }),
    }).then(r => r.json());

    if (res.success) {
      alert('✅ Đã lưu vào Sổ Hành Trình!');
      location.reload();
    } else {
      alert('Lỗi: ' + res.message);
    }
  };
})();
</script>
</body>
</html>
