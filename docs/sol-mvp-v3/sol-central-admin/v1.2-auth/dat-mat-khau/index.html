<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt mật khẩu Sol — sol.vn</title>
  <meta name="robots" content="noindex,nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --amber: #F59E0B; --amber-dark: #D97706; --amber-light: #FCD34D;
      --navy: #0F172A; --navy-2: #1E293B; --navy-3: #334155;
      --slate: #64748B; --slate-2: #94A3B8; --slate-3: #CBD5E1;
      --slate-4: #E2E8F0; --slate-5: #F1F5F9;
      --green: #16A34A; --red: #DC2626; --white: #FFFFFF;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
      color: var(--slate-5);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 480px; width: 100%;
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: -80px; right: -80px;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(245,158,11,0.18) 0%, transparent 65%);
      border-radius: 50%; pointer-events: none;
    }
    .logo { text-align: center; margin-bottom: 20px; position: relative; }
    .logo-icon { font-size: 44px; margin-bottom: 6px; }
    .logo-text {
      font-family: 'Lora', serif;
      font-size: 20px; font-weight: 700;
      color: var(--amber); letter-spacing: 0.5px;
    }
    .logo-sub {
      font-size: 11px; color: var(--slate-2);
      letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;
    }

    h1 {
      font-family: 'Lora', serif;
      font-size: 26px; font-weight: 700;
      color: var(--white);
      text-align: center; margin: 24px 0 8px;
      line-height: 1.2;
    }
    .subtitle {
      color: var(--slate-3); font-size: 15px;
      text-align: center; margin-bottom: 24px;
    }
    .subtitle b { color: var(--amber-light); }

    .form-group { margin-bottom: 16px; position: relative; }
    .form-label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--slate-3); margin-bottom: 6px;
    }
    .form-input {
      width: 100%; padding: 13px 14px; font-size: 15px;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid var(--navy-3);
      border-radius: 10px;
      color: var(--white); font-family: inherit;
      transition: border-color 0.15s;
    }
    .form-input:focus {
      outline: none; border-color: var(--amber);
      background: rgba(15, 23, 42, 0.8);
    }
    .form-input::placeholder { color: var(--slate); }
    .form-hint {
      font-size: 12.5px; color: var(--slate-2); margin-top: 6px;
    }
    .form-hint.ok { color: var(--green); }
    .form-hint.err { color: var(--red); }

    .strength-bar {
      height: 4px; border-radius: 2px; margin-top: 6px;
      background: var(--navy-3);
      overflow: hidden;
    }
    .strength-bar__fill {
      height: 100%; width: 0%;
      transition: width 0.3s, background 0.3s;
      background: var(--red);
    }
    .strength-bar__fill.medium { width: 50%; background: var(--amber); }
    .strength-bar__fill.strong { width: 100%; background: var(--green); }

    .btn-submit {
      width: 100%; padding: 15px 20px;
      background: linear-gradient(135deg, var(--amber) 0%, var(--amber-dark) 100%);
      color: var(--white);
      border: none; border-radius: 12px;
      font-weight: 700; font-size: 16px;
      cursor: pointer; margin-top: 20px;
      box-shadow: 0 12px 30px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s;
      font-family: inherit;
    }
    .btn-submit:hover:not(:disabled) { transform: translateY(-2px); }
    .btn-submit:disabled {
      opacity: 0.6; cursor: not-allowed;
      box-shadow: none;
    }

    .error-box {
      display: none;
      background: rgba(220, 38, 38, 0.15);
      border-left: 3px solid var(--red);
      color: #FCA5A5;
      padding: 14px 16px; border-radius: 8px;
      margin-bottom: 16px; font-size: 14px;
    }
    .error-box.active { display: block; }

    .success-state {
      display: none; text-align: center;
    }
    .success-icon {
      font-size: 64px; margin: 16px 0;
      animation: bounce 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }
    @keyframes bounce {
      0% { transform: scale(0); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .footer-note {
      margin-top: 24px; padding-top: 18px;
      border-top: 1px solid rgba(148,163,184,0.15);
      color: var(--slate-2); font-size: 12px; text-align: center;
      line-height: 1.6;
    }
    .footer-note a { color: var(--amber-light); text-decoration: none; }

    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🧭</div>
      <div class="logo-text">Sol La Bàn</div>
      <div class="logo-sub">Đặt mật khẩu</div>
    </div>

    <div id="state-form">
      <h1>Đặt mật khẩu Sol</h1>
      <p class="subtitle" id="welcome-msg">Chào <b id="user-name">bạn</b>! Đặt mật khẩu để đăng nhập từ mọi thiết bị.</p>

      <div class="error-box" id="error-box"></div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu mới</label>
        <input type="password" class="form-input" id="password" placeholder="Ít nhất 8 ký tự, có số" autocomplete="new-password">
        <div class="strength-bar"><div class="strength-bar__fill" id="strength-fill"></div></div>
        <div class="form-hint" id="pwd-hint">Ít nhất 8 ký tự, có ít nhất 1 số</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password-confirm">Xác nhận mật khẩu</label>
        <input type="password" class="form-input" id="password-confirm" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
        <div class="form-hint" id="confirm-hint">&nbsp;</div>
      </div>

      <button class="btn-submit" id="btn-submit" disabled>🔒 Đặt mật khẩu & Đăng nhập</button>
    </div>

    <div class="success-state" id="state-success">
      <div class="success-icon">🎉</div>
      <h1>Đặt mật khẩu thành công!</h1>
      <p class="subtitle">Đang chuyển tới Sol La Bàn...</p>
    </div>

    <div class="footer-note">
      Có gì không rõ, nhắn Zalo <a href="https://zalo.me/0912727381">0912727381</a>.<br>
      — <b>Khang Sol</b> · Founder sol.vn
    </div>
  </div>

  <script>
    (function () {
      var API_BASE = 'https://huongdi.sol.vn';
      var HUONGDI_URL = 'https://huongdi.sol.vn/';

      var $ = function (id) { return document.getElementById(id); };
      function showError(msg) {
        var box = $('error-box');
        box.textContent = msg;
        box.classList.add('active');
      }
      function hideError() { $('error-box').classList.remove('active'); }

      // Get token from URL
      var params = new URLSearchParams(window.location.search);
      var token = (params.get('token') || '').trim();

      if (!token || token.length < 20) {
        showError('Link không hợp lệ. Vui lòng dùng link Sol đã gửi qua Zalo/Email.');
        $('btn-submit').style.display = 'none';
        return;
      }

      // Password strength
      var pwd = $('password');
      var confirm = $('password-confirm');
      var btn = $('btn-submit');

      function calcStrength(p) {
        if (p.length < 8) return 'weak';
        if (p.length >= 8 && /[0-9]/.test(p) && /[a-zA-Z]/.test(p)) {
          if (p.length >= 12 && /[^a-zA-Z0-9]/.test(p)) return 'strong';
          return 'medium';
        }
        return 'weak';
      }

      function validate() {
        var p = pwd.value;
        var c = confirm.value;

        // Password rules
        if (p.length === 0) {
          $('pwd-hint').textContent = 'Ít nhất 8 ký tự, có ít nhất 1 số';
          $('pwd-hint').className = 'form-hint';
        } else if (p.length < 8) {
          $('pwd-hint').textContent = '❌ Cần ít nhất 8 ký tự';
          $('pwd-hint').className = 'form-hint err';
        } else if (!/[0-9]/.test(p)) {
          $('pwd-hint').textContent = '❌ Cần ít nhất 1 số';
          $('pwd-hint').className = 'form-hint err';
        } else {
          $('pwd-hint').textContent = '✓ Mật khẩu hợp lệ';
          $('pwd-hint').className = 'form-hint ok';
        }

        // Strength bar
        var s = calcStrength(p);
        $('strength-fill').className = 'strength-bar__fill ' + s;

        // Confirm match
        if (c.length === 0) {
          $('confirm-hint').textContent = ' ';
          $('confirm-hint').className = 'form-hint';
        } else if (c !== p) {
          $('confirm-hint').textContent = '❌ Mật khẩu không khớp';
          $('confirm-hint').className = 'form-hint err';
        } else {
          $('confirm-hint').textContent = '✓ Khớp';
          $('confirm-hint').className = 'form-hint ok';
        }

        // Enable button if valid
        var valid = p.length >= 8 && /[0-9]/.test(p) && p === c;
        btn.disabled = !valid;
      }

      pwd.addEventListener('input', validate);
      confirm.addEventListener('input', validate);

      // Submit
      btn.addEventListener('click', async function () {
        hideError();
        btn.disabled = true;
        btn.textContent = '⏳ Đang xử lý...';

        try {
          var res = await fetch(API_BASE + '/api/auth/set-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token: token,
              password: pwd.value,
              password_confirm: confirm.value,
            })
          });
          var data = await res.json();

          if (!data.success) {
            showError(data.message || 'Có lỗi. Vui lòng thử lại.');
            btn.disabled = false;
            btn.textContent = '🔒 Đặt mật khẩu & Đăng nhập';
            return;
          }

          // Success — save session + redirect
          try {
            localStorage.setItem('sol_session_token', data.token);
            localStorage.setItem('sol_tier',          data.tier);
            localStorage.setItem('sol_ten',           data.ten);
            localStorage.setItem('sol_expires_at',    data.expires_at || '');
            localStorage.setItem('sol_activated_at',  new Date().toISOString());
            localStorage.setItem('sol_active',        'true');
            if (data.tier === 'founder') localStorage.setItem('sol_founder', 'true');
          } catch (e) { /* ignore */ }

          $('state-form').style.display = 'none';
          $('state-success').style.display = 'block';

          setTimeout(function () {
            var handoffParams = new URLSearchParams({
              welcome: '1',
              tier: data.tier,
              ten: data.ten,
              expires: data.expires_at || '',
              token: token.substring(0, 12),
              jwt: data.token
            });
            window.location.href = HUONGDI_URL + '?' + handoffParams.toString();
          }, 1500);
        } catch (err) {
          console.error(err);
          showError('Không kết nối được máy chủ. Vui lòng thử lại hoặc Zalo 0912727381.');
          btn.disabled = false;
          btn.textContent = '🔒 Đặt mật khẩu & Đăng nhập';
        }
      });

      // Auto-focus password
      pwd.focus();
    })();
  </script>
</body>
</html>
