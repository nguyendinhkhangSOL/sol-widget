<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect x="0" y="0" width="1200" height="8" fill="#F59E0B"/>

  <!-- Category label -->
  <text x="80" y="90" font-family="'Inter', Arial, sans-serif" font-size="18" fill="#F59E0B" font-weight="700" letter-spacing="5">
    CHUYÊN ĐỀ · AI CHO NGƯỜI 40+
  </text>

  <!-- Left side: Title (compact) -->
  <text x="80" y="180" font-family="Georgia, 'Lora', serif" font-size="54" font-weight="800" fill="#FFFFFF">
    AI làm hộ 10 việc
  </text>
  <text x="80" y="240" font-family="Georgia, 'Lora', serif" font-size="54" font-weight="800" fill="#FFFFFF">
    kinh doanh —
  </text>
  <text x="80" y="300" font-family="Georgia, 'Lora', serif" font-size="42" font-weight="700" fill="#F59E0B" font-style="italic">
    nếu biết cách "ra đề"
  </text>

  <!-- Subtitle -->
  <text x="80" y="360" font-family="'Inter', sans-serif" font-size="20" fill="#CBD5E1" font-weight="400">
    Bốn nguyên tắc viết prompt hiệu quả
  </text>
  <text x="80" y="390" font-family="'Inter', sans-serif" font-size="20" fill="#CBD5E1" font-weight="400">
    cho chuyên gia độ tuổi 40 đến 60.
  </text>

  <!-- Right side: Chat bubbles (visual metaphor for prompt→AI) -->
  <g transform="translate(680, 130)">
    <!-- User bubble 1 (dark) -->
    <rect x="0" y="0" width="440" height="80" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" font-weight="700" letter-spacing="1">BẠN HỎI</text>
    <text x="20" y="58" font-family="'Inter', sans-serif" font-size="17" fill="#FFFFFF" font-style="italic">
      "Viết cho tôi một email tiếp thị"
    </text>

    <!-- AI response (weak) -->
    <rect x="60" y="100" width="380" height="60" rx="16" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <text x="80" y="128" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" font-weight="700" letter-spacing="1">AI TRẢ LỜI</text>
    <text x="80" y="148" font-family="'Inter', sans-serif" font-size="15" fill="#64748B">
      "Kết quả chung chung..."
    </text>

    <!-- Arrow down -->
    <text x="220" y="200" font-family="Georgia, serif" font-size="32" fill="#F59E0B" text-anchor="middle" font-weight="800">↓</text>

    <!-- User bubble 2 (good — amber accent) -->
    <rect x="0" y="220" width="440" height="120" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="20" y="250" font-family="'Inter', sans-serif" font-size="12" fill="#F59E0B" font-weight="700" letter-spacing="1">BẠN HỎI ĐÚNG</text>
    <text x="20" y="278" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF">
      "Tôi là CFO F&amp;B 52 tuổi. Viết email
    </text>
    <text x="20" y="298" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF">
      tiếp cận Chủ chuỗi nhà hàng 8-15 chi
    </text>
    <text x="20" y="318" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF">
      nhánh, tiếng Việt tự nhiên, ~150 từ..."
    </text>

    <!-- AI response (strong — amber tick) -->
    <rect x="60" y="360" width="380" height="60" rx="16" fill="#F59E0B"/>
    <text x="80" y="388" font-family="'Inter', sans-serif" font-size="12" fill="#0F172A" font-weight="700" letter-spacing="1">AI TRẢ LỜI</text>
    <text x="80" y="408" font-family="'Inter', sans-serif" font-size="15" fill="#0F172A" font-weight="600">
      ✓ Email chất lượng cao, 30-60 giây
    </text>
  </g>

  <!-- Bottom: Sol brand -->
  <g transform="translate(80, 540)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="20" cy="20" r="3" fill="#F59E0B"/>
    <path d="M 20 5 L 23 20 L 20 35 L 17 20 Z" fill="#F59E0B"/>

    <text x="55" y="18" font-family="Georgia, serif" font-size="18" font-weight="800" fill="#FFFFFF">SOL LA BÀN</text>
    <text x="55" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#94A3B8">sol.vn — Đồng hành người Việt 40-60 tái khởi nghiệp đúng hướng</text>
  </g>

  <rect x="0" y="622" width="1200" height="8" fill="#F59E0B"/>
</svg>
