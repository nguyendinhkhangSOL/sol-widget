<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>

  <!-- Top amber accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#F59E0B"/>

  <!-- Subtle grid pattern (decorative) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeMask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="8" width="1200" height="622" fill="url(#grid)" opacity="0.5"/>
  <rect x="0" y="8" width="1200" height="622" fill="url(#fadeMask)"/>

  <!-- Category label -->
  <text x="80" y="90" font-family="'Inter', Arial, sans-serif" font-size="18" fill="#F59E0B" font-weight="700" letter-spacing="5">
    CÔNG CỤ · AI
  </text>

  <!-- Main title -->
  <text x="80" y="180" font-family="Georgia, 'Lora', serif" font-size="60" font-weight="800" fill="#FFFFFF">
    10 công việc kinh doanh
  </text>
  <text x="80" y="250" font-family="Georgia, 'Lora', serif" font-size="60" font-weight="800" fill="#FFFFFF">
    AI có thể làm cho anh chị
  </text>
  <text x="80" y="315" font-family="Georgia, 'Lora', serif" font-size="42" font-weight="700" fill="#F59E0B" font-style="italic">
    — nếu biết ra đề đúng
  </text>

  <!-- Subtitle -->
  <text x="80" y="370" font-family="'Inter', sans-serif" font-size="22" fill="#CBD5E1" font-weight="400">
    Bốn nguyên tắc và mười ứng dụng cụ thể cho chuyên gia 40–60
  </text>

  <!-- Bottom row: number badge + right side visual -->

  <!-- Left: Big "10" number card -->
  <g transform="translate(80, 430)">
    <rect x="0" y="0" width="140" height="140" rx="16" fill="#F59E0B"/>
    <text x="70" y="95" font-family="Georgia, 'Lora', serif" font-size="88" font-weight="900" fill="#0F172A" text-anchor="middle">10</text>
    <text x="70" y="125" font-family="'Inter', sans-serif" font-size="14" fill="#0F172A" font-weight="700" text-anchor="middle" letter-spacing="2">ỨNG DỤNG</text>
  </g>

  <!-- Middle: "AI" number card -->
  <g transform="translate(250, 430)">
    <rect x="0" y="0" width="140" height="140" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="70" y="95" font-family="Georgia, 'Lora', serif" font-size="72" font-weight="900" fill="#F59E0B" text-anchor="middle">AI</text>
    <text x="70" y="125" font-family="'Inter', sans-serif" font-size="14" fill="#CBD5E1" font-weight="700" text-anchor="middle" letter-spacing="2">TRỢ LÝ</text>
  </g>

  <!-- Middle: "4" number card -->
  <g transform="translate(420, 430)">
    <rect x="0" y="0" width="140" height="140" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="70" y="95" font-family="Georgia, 'Lora', serif" font-size="88" font-weight="900" fill="#F59E0B" text-anchor="middle">4</text>
    <text x="70" y="125" font-family="'Inter', sans-serif" font-size="14" fill="#CBD5E1" font-weight="700" text-anchor="middle" letter-spacing="2">NGUYÊN TẮC</text>
  </g>

  <!-- Right: Sol logo mark + brand -->
  <g transform="translate(920, 460)">
    <!-- Compass icon (stylized) -->
    <circle cx="40" cy="40" r="38" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="40" cy="40" r="4" fill="#F59E0B"/>
    <path d="M 40 8 L 46 40 L 40 72 L 34 40 Z" fill="#F59E0B"/>
    <path d="M 8 40 L 40 34 L 72 40 L 40 46 Z" fill="#F59E0B" opacity="0.4"/>

    <text x="100" y="30" font-family="Georgia, 'Lora', serif" font-size="24" font-weight="800" fill="#FFFFFF">
      SOL LA BÀN
    </text>
    <text x="100" y="55" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8" font-weight="500">
      sol.vn
    </text>
    <text x="100" y="80" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8" font-weight="500">
      Tái khởi nghiệp đúng hướng
    </text>
  </g>

  <!-- Bottom amber accent bar -->
  <rect x="0" y="622" width="1200" height="8" fill="#F59E0B"/>
</svg>
