<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect x="0" y="0" width="1200" height="8" fill="#F59E0B"/>

  <defs>
    <pattern id="dotPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#1E293B"/>
    </pattern>
  </defs>
  <rect x="0" y="8" width="1200" height="622" fill="url(#dotPattern)" opacity="0.6"/>

  <!-- Category -->
  <text x="80" y="90" font-family="'Inter', Arial, sans-serif" font-size="18" fill="#F59E0B" font-weight="700" letter-spacing="5">
    HƯỚNG DẪN · AI
  </text>

  <!-- Main title with question mark emphasis -->
  <text x="80" y="200" font-family="Georgia, 'Lora', serif" font-size="72" font-weight="800" fill="#FFFFFF">
    Ra đề đúng
  </text>
  <text x="80" y="280" font-family="Georgia, 'Lora', serif" font-size="72" font-weight="800" fill="#F59E0B" font-style="italic">
    AI làm hộ 10 việc
  </text>

  <!-- Subtitle -->
  <text x="80" y="340" font-family="'Inter', sans-serif" font-size="24" fill="#CBD5E1" font-weight="400">
    Cho chuyên gia Việt 40–60: ChatGPT có thể viết trang giới thiệu,
  </text>
  <text x="80" y="375" font-family="'Inter', sans-serif" font-size="24" fill="#CBD5E1" font-weight="400">
    email tiếp cận, bảng giá dịch vụ... nếu biết cách hỏi.
  </text>

  <!-- 10 dots — visual for "10 uses" -->
  <g transform="translate(80, 460)">
    <text x="0" y="-10" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" font-weight="700" letter-spacing="3">10 ỨNG DỤNG</text>
    <g fill="#F59E0B">
      <circle cx="10" cy="20" r="8"/>
      <circle cx="40" cy="20" r="8"/>
      <circle cx="70" cy="20" r="8"/>
      <circle cx="100" cy="20" r="8"/>
      <circle cx="130" cy="20" r="8"/>
      <circle cx="160" cy="20" r="8"/>
      <circle cx="190" cy="20" r="8"/>
      <circle cx="220" cy="20" r="8"/>
      <circle cx="250" cy="20" r="8"/>
      <circle cx="280" cy="20" r="8"/>
    </g>
    <text x="0" y="60" font-family="'Inter', sans-serif" font-size="16" fill="#CBD5E1">
      Trang giới thiệu · LinkedIn · Email · Bảng giá · FAQ · Case study · Newsletter · SOP...
    </text>
  </g>

  <!-- Right: Compass + brand -->
  <g transform="translate(900, 480)">
    <circle cx="50" cy="50" r="48" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="50" cy="50" r="5" fill="#F59E0B"/>
    <path d="M 50 10 L 58 50 L 50 90 L 42 50 Z" fill="#F59E0B"/>
    <path d="M 10 50 L 50 42 L 90 50 L 50 58 Z" fill="#F59E0B" opacity="0.4"/>

    <text x="120" y="35" font-family="Georgia, 'Lora', serif" font-size="28" font-weight="800" fill="#FFFFFF">
      SOL.VN
    </text>
    <text x="120" y="60" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8" font-weight="500">
      Sol La Bàn — Tái khởi
    </text>
    <text x="120" y="80" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8" font-weight="500">
      nghiệp đúng hướng
    </text>
  </g>

  <rect x="0" y="622" width="1200" height="8" fill="#F59E0B"/>
</svg>
