    <text x="230" y="85" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">KHAI PHÁ</text>
    <path d="M 285 0 L 345 0 M 335 -10 L 345 0 L 335 10" stroke="#334155" stroke-width="2" fill="none"/>

