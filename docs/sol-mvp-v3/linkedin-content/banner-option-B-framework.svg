<svg viewBox="0 0 1584 396" width="1584" height="396" xmlns="http://www.w3.org/2000/svg">
  <title>Sol La Bàn - Option B 5 Bước Framework</title>

  <!-- Navy background -->
  <rect width="1584" height="396" fill="#0F172A"/>

  <!-- Amber accent bar left -->
  <rect x="0" y="0" width="12" height="396" fill="#F59E0B"/>

  <!-- Header top -->
  <text x="440" y="80" font-family="'Inter', Arial, sans-serif" font-size="18" fill="#F59E0B" font-weight="700" letter-spacing="4">
    KHUNG PHƯƠNG PHÁP SOL LA BÀN
  </text>
  <text x="440" y="118" font-family="Georgia, 'Lora', serif" font-size="34" font-weight="700" fill="#FFFFFF">
    Tái khởi nghiệp đúng hướng cho người Việt 40-60
  </text>

  <!-- 5 steps horizontal -->
  <g transform="translate(440, 175)">
    <!-- Step 1 -->
    <circle cx="60" cy="30" r="30" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="2"/>
    <text x="60" y="42" font-family="Georgia, serif" font-size="28" font-weight="800" fill="#F59E0B" text-anchor="middle">1</text>
    <text x="60" y="95" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">THẤU HIỂU</text>
    <text x="60" y="115" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">DNA nghề nghiệp</text>
    <path d="M 105 30 L 155 30 M 145 22 L 155 30 L 145 38" stroke="#334155" stroke-width="2" fill="none"/>

    <!-- Step 2 -->
    <circle cx="200" cy="30" r="30" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="2"/>
    <text x="200" y="42" font-family="Georgia, serif" font-size="28" font-weight="800" fill="#F59E0B" text-anchor="middle">2</text>
    <text x="200" y="95" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">KHAI PHÁ</text>
    <text x="200" y="115" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">8 vốn ngầm</text>
    <path d="M 245 30 L 295 30 M 285 22 L 295 30 L 285 38" stroke="#334155" stroke-width="2" fill="none"/>

    <!-- Step 3 -->
    <circle cx="340" cy="30" r="30" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="2"/>
    <text x="340" y="42" font-family="Georgia, serif" font-size="28" font-weight="800" fill="#F59E0B" text-anchor="middle">3</text>
    <text x="340" y="95" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CHỌN HƯỚNG</text>
    <text x="340" y="115" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">37 mô hình</text>
    <path d="M 385 30 L 435 30 M 425 22 L 435 30 L 425 38" stroke="#334155" stroke-width="2" fill="none"/>

    <!-- Step 4 -->
    <circle cx="480" cy="30" r="30" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="2"/>
    <text x="480" y="42" font-family="Georgia, serif" font-size="28" font-weight="800" fill="#F59E0B" text-anchor="middle">4</text>
    <text x="480" y="95" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">HÀNH ĐỘNG</text>
    <text x="480" y="115" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Lộ trình 90 ngày</text>
    <path d="M 525 30 L 575 30 M 565 22 L 575 30 L 565 38" stroke="#334155" stroke-width="2" fill="none"/>

    <!-- Step 5 -->
    <circle cx="620" cy="30" r="30" fill="#F59E0B" stroke="#F59E0B" stroke-width="2"/>
    <text x="620" y="42" font-family="Georgia, serif" font-size="28" font-weight="800" fill="#0F172A" text-anchor="middle">5</text>
    <text x="620" y="95" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AN TOÀN</text>
    <text x="620" y="115" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Bền vững 10+ năm</text>
  </g>

  <!-- Bottom credit -->
  <text x="440" y="365" font-family="'Inter', Arial, sans-serif" font-size="15" fill="#64748B" font-weight="600" letter-spacing="2">
    SOL.VN · NGUYỄN ĐÌNH KHANG · NGƯỜI SÁNG LẬP
  </text>

  <!-- Sol S logo right -->
  <circle cx="1440" cy="198" r="75" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.4"/>
  <circle cx="1440" cy="198" r="55" fill="#F59E0B" opacity="0.1"/>
  <text x="1440" y="225" font-family="Georgia, 'Lora', serif" font-size="65" font-weight="800" fill="#F59E0B" text-anchor="middle">S</text>
  <text x="1440" y="310" font-family="Georgia, 'Lora', serif" font-size="16" fill="#F59E0B" text-anchor="middle" font-style="italic">Đi cùng Sol</text>
</svg>
