# ═══════════════════════════════════════════════════════════════════════
# Nginx 301 Redirects — P1/P2/P3 → Vietnamese SEO URLs
# ═══════════════════════════════════════════════════════════════════════
#
# File này CHÈN VÀO server block hiện tại của huongdi.sol.vn
# Path: /etc/nginx/sites-available/huongdi.sol.vn
#
# Sau khi thêm:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Test:
#   curl -I https://huongdi.sol.vn/p1.html
#   → HTTP/1.1 301 Moved Permanently
#   → Location: https://huongdi.sol.vn/kham-pha-ban-than/
# ═══════════════════════════════════════════════════════════════════════

# ── P1: Khám phá bản thân ────────────────────────────────────────────
# Match cả /p1, /p1.html, /p1/, với hoặc không query string
location = /p1.html {
  return 301 https://$host/kham-pha-ban-than/$is_args$args;
}
location = /p1 {
  return 301 https://$host/kham-pha-ban-than/$is_args$args;
}
location = /p1/ {
  return 301 https://$host/kham-pha-ban-than/$is_args$args;
}

# ── P2: Kiểm kê nguồn lực ────────────────────────────────────────────
location = /p2.html {
  return 301 https://$host/kiem-ke-nguon-luc/$is_args$args;
}
location = /p2 {
  return 301 https://$host/kiem-ke-nguon-luc/$is_args$args;
}
location = /p2/ {
  return 301 https://$host/kiem-ke-nguon-luc/$is_args$args;
}

# ── P3: La bàn hướng đi ──────────────────────────────────────────────
location = /p3.html {
  return 301 https://$host/la-ban-huong-di/$is_args$args;
}
location = /p3 {
  return 301 https://$host/la-ban-huong-di/$is_args$args;
}
location = /p3/ {
  return 301 https://$host/la-ban-huong-di/$is_args$args;
}

# ── New URLs: serve static HTML files với clean URL ──────────────────
location = /kham-pha-ban-than/ {
  try_files /kham-pha-ban-than/index.html =404;
  add_header Cache-Control "public, max-age=300";
}
location = /kham-pha-ban-than {
  return 301 https://$host/kham-pha-ban-than/$is_args$args;
}

location = /kiem-ke-nguon-luc/ {
  try_files /kiem-ke-nguon-luc/index.html =404;
  add_header Cache-Control "public, max-age=300";
}
location = /kiem-ke-nguon-luc {
  return 301 https://$host/kiem-ke-nguon-luc/$is_args$args;
}

location = /la-ban-huong-di/ {
  try_files /la-ban-huong-di/index.html =404;
  add_header Cache-Control "public, max-age=300";
}
location = /la-ban-huong-di {
  return 301 https://$host/la-ban-huong-di/$is_args$args;
}

