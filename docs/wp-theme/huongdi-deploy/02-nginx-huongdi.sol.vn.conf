# ═══════════════════════════════════════════════════════════════════════
# Nginx Vhost — huongdi.sol.vn (Frontend P1/P2/P3)
# ═══════════════════════════════════════════════════════════════════════
#
# Cài đặt:
#   sudo cp 02-nginx-huongdi.sol.vn.conf /etc/nginx/sites-available/huongdi.sol.vn
#   sudo ln -s /etc/nginx/sites-available/huongdi.sol.vn /etc/nginx/sites-enabled/
#
# Lưu ý SSL:
#   - Lần đầu chạy certbot, COMMENT OUT phần "listen 443 ssl" và "ssl_certificate"
#   - Lấy SSL: sudo certbot --nginx -d huongdi.sol.vn -d adminhuongdi.sol.vn
#   - Certbot sẽ tự uncomment + thêm ssl_certificate_path
#   - Hoặc copy lại file này sau khi cert đã có
# ═══════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name huongdi.sol.vn;

    # Cho phép certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/huongdi/public;
    }

    # Redirect tất cả về HTTPS (sau khi có SSL)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main vhost ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name huongdi.sol.vn;

    # SSL (Let's Encrypt — certbot tự fill sau khi chạy)
    ssl_certificate /etc/letsencrypt/live/huongdi.sol.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huongdi.sol.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Root + index ──────────────────────────────────────────────────
    root /var/www/huongdi/public;
    index index.html p1.html;

    # ── Logging ───────────────────────────────────────────────────────
    access_log /var/log/nginx/huongdi.sol.vn.access.log;
    error_log /var/log/nginx/huongdi.sol.vn.error.log warn;

    # ── Body size (cho upload nếu cần) ────────────────────────────────
    client_max_body_size 10M;

    # ── API proxy → huongdi-api:4001 ──────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── Static assets cache (CSS/JS/images) ───────────────────────────
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|png|webp|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── HTML pages — short cache ──────────────────────────────────────
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Frontend SPA-like routing ─────────────────────────────────────
    # huongdi dùng static HTML files (p1.html, p2.html, p3.html)
    # Try file → folder → fallback to .html extension
    location / {
        try_files $uri $uri/ $uri.html /p1.html;
    }

    # ── Robots.txt + sitemap ──────────────────────────────────────────
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # ── Deny access to hidden files ───────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
