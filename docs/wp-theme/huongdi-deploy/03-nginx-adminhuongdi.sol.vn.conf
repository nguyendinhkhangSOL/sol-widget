# ═══════════════════════════════════════════════════════════════════════
# Nginx Vhost — adminhuongdi.sol.vn (Admin SPA React/Vite)
# ═══════════════════════════════════════════════════════════════════════
#
# Cài đặt:
#   sudo cp 03-nginx-adminhuongdi.sol.vn.conf /etc/nginx/sites-available/adminhuongdi.sol.vn
#   sudo ln -s /etc/nginx/sites-available/adminhuongdi.sol.vn /etc/nginx/sites-enabled/
#
# Lưu ý SSL: tương tự huongdi.sol.vn — certbot sẽ tự fill SSL paths
# ═══════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name adminhuongdi.sol.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/huongdi/admin/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main vhost ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adminhuongdi.sol.vn;

    # SSL
    ssl_certificate /etc/letsencrypt/live/adminhuongdi.sol.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adminhuongdi.sol.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers (chặt hơn vì là admin) ───────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "noindex, nofollow" always;  # KHÔNG index admin

    # ── IP whitelist (OPTIONAL — uncomment để bật) ────────────────────
    # Chỉ cho phép IP văn phòng/VPN truy cập admin
    # allow 123.456.789.0;       # ← IP văn phòng anh
    # allow 1.2.3.4;             # ← IP VPN
    # deny all;

    # ── Root + index ──────────────────────────────────────────────────
    root /var/www/huongdi/admin/dist;
    index index.html;

    # ── Logging ───────────────────────────────────────────────────────
    access_log /var/log/nginx/adminhuongdi.sol.vn.access.log;
    error_log /var/log/nginx/adminhuongdi.sol.vn.error.log warn;

    client_max_body_size 10M;

    # ── API proxy → huongdi-api:4001 (CÙNG backend với frontend) ──────
    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Admin API timeout dài hơn (cho heavy queries)
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Vite hashed assets — long cache ───────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Static files (favicon, robots) ────────────────────────────────
    location ~* \.(?:ico|png|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── SPA fallback — React Router ───────────────────────────────────
    location / {
        try_files $uri /index.html;
        # Index.html không cache (cho SPA update)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Deny hidden files ─────────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
