<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Đi Cùng Sol — Cai thuốc lá theo 4 chặng tiến hoá">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B25C2C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <g transform="translate(60, 70)">
    <circle cx="20" cy="20" r="22" fill="white"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#B25C2C" text-anchor="middle">S</text>
    <text x="60" y="14" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="white" opacity="0.85">ĐI CÙNG SOL</text>
    <text x="60" y="34" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white">Bỏ thuốc lá</text>
  </g>

  <text x="600" y="245" font-family="Arial, sans-serif" font-size="20" letter-spacing="6" fill="white" text-anchor="middle" opacity="0.85">4 CHẶNG TIẾN HOÁ</text>

  <text x="600" y="335" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="white" text-anchor="middle">Cai thuốc lá</text>
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="44" font-weight="500" fill="white" text-anchor="middle" opacity="0.95">cùng Khang Sol</text>

  <g transform="translate(600, 480)">
    <rect x="-220" y="-20" width="440" height="50" rx="25" fill="white"/>
    <text x="0" y="13" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#B25C2C" text-anchor="middle">7 ngày đầu miễn phí</text>
  </g>

  <text x="600" y="580" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="white" text-anchor="middle" opacity="0.75">SOL.VN/BO-THUOC-LA</text>
</svg>
