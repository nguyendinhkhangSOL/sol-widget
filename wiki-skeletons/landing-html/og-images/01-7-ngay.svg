<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sol — 7 ngày Nhận Thức · Biết rõ kẻ thù">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B25C2C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <g transform="translate(60, 70)">
    <circle cx="20" cy="20" r="22" fill="white"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#B25C2C" text-anchor="middle">S</text>
    <text x="60" y="14" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="white" opacity="0.85">ĐI CÙNG SOL</text>
    <text x="60" y="34" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white">Bỏ thuốc lá</text>
  </g>

  <g transform="translate(1080, 80)">
    <rect x="-100" y="-20" width="100" height="36" rx="18" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="-50" y="3" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">MIỄN PHÍ</text>
  </g>

  <text x="600" y="225" font-family="Arial, sans-serif" font-size="18" letter-spacing="6" fill="white" text-anchor="middle" opacity="0.85">CHẶNG 1 · MỞ ĐẦU</text>

  <text x="600" y="320" font-family="Arial, sans-serif" font-size="120" font-weight="700" fill="white" text-anchor="middle">7 NGÀY</text>
  <text x="600" y="395" font-family="Arial, sans-serif" font-size="42" font-weight="500" fill="white" text-anchor="middle" opacity="0.95">Biết rõ kẻ thù của anh</text>

  <text x="600" y="490" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.85">Không bỏ · Không ép · Chỉ quan sát</text>

  <text x="600" y="575" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="white" text-anchor="middle" opacity="0.75">SOL.VN/BO-THUOC-LA/7-NGAY</text>
</svg>
