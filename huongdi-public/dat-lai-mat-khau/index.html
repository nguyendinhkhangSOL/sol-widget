<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lại mật khẩu — Sol La Bàn</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --amber:#F59E0B; --amber-dark:#B45309; --amber-light:#FEF3C7;
    --navy:#0F172A; --slate:#64748B; --border:#E2E8F0; --bg:#F8FAFC;
    --white:#FFFFFF; --success:#16A34A; --error:#DC2626;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system, 'Segoe UI', Roboto, Inter, sans-serif; background:var(--bg); color:var(--navy); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:40px; width:100%; max-width:440px; box-shadow:0 20px 60px rgba(0,0,0,0.08); }
  .logo { font-size:28px; margin-bottom:4px; text-align:center; }
  h1 { font-size:22px; margin-bottom:8px; text-align:center; }
  .subtitle { color:var(--slate); font-size:14px; margin-bottom:24px; text-align:center; }
  .field { margin-bottom:18px; }
  label { display:block; font-size:13px; color:var(--slate); margin-bottom:6px; font-weight:500; }
  input { width:100%; padding:12px 14px; background:var(--bg); color:var(--navy); border:1px solid var(--border); border-radius:8px; font-size:15px; }
  input:focus { outline:none; border-color:var(--amber); background:var(--white); }
  .btn { width:100%; padding:14px; background:var(--amber); color:var(--navy); border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn:hover { opacity:0.9; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .msg { padding:12px; border-radius:8px; font-size:14px; margin-bottom:18px; display:none; }
  .msg.error { background:#FEF2F2; color:var(--error); border:1px solid var(--error); display:block; }
  .msg.success { background:#F0FDF4; color:var(--success); border:1px solid var(--success); display:block; }
  .footer { text-align:center; margin-top:24px; padding-top:24px; border-top:1px solid var(--border); font-size:13px; color:var(--slate); }
  .footer a { color:var(--amber-dark); text-decoration:none; font-weight:500; }
  .password-strength { font-size:12px; margin-top:4px; }
  .password-strength.weak { color:var(--error); }
  .password-strength.medium { color:var(--amber-dark); }
  .password-strength.strong { color:var(--success); }
  .status-loading { text-align:center; padding:20px; color:var(--slate); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🧭</div>
  <h1>Đặt mật khẩu mới</h1>
  <p class="subtitle" id="emailHint">Đang xác thực link...</p>

  <div id="msg" class="msg"></div>

  <div id="loading" class="status-loading">
    ⏳ Đang kiểm tra link...
  </div>

  <form id="resetForm" style="display:none;">
    <div class="field">
      <label for="password">Mật khẩu mới (tối thiểu 6 ký tự)</label>
      <input type="password" id="password" name="password" minlength="6" required autofocus>
      <div class="password-strength" id="strength"></div>
    </div>
    <div class="field">
      <label for="confirm">Xác nhận mật khẩu</label>
      <input type="password" id="confirm" name="confirm" minlength="6" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Đặt mật khẩu mới →</button>
  </form>

  <div id="expiredBlock" style="display:none; text-align:center;">
    <p style="color:var(--error); margin-bottom:16px;">⚠️ Link hết hạn hoặc đã dùng.</p>
    <a href="/quen-mat-khau/" class="btn" style="display:inline-block; text-align:center; text-decoration:none;">Yêu cầu link mới</a>
  </div>

  <div class="footer">
    <a href="/dang-nhap/">← Quay lại đăng nhập</a>
  </div>
</div>

<script>
(function() {
  const API_BASE = window.SOL_API_BASE || 'https://huongdi.sol.vn/api';
  const token = new URLSearchParams(location.search).get('token');
  const msg = document.getElementById('msg');
  const form = document.getElementById('resetForm');
  const loading = document.getElementById('loading');
  const expiredBlock = document.getElementById('expiredBlock');
  const emailHint = document.getElementById('emailHint');
  const btn = document.getElementById('submitBtn');
  const password = document.getElementById('password');
  const confirm = document.getElementById('confirm');
  const strengthEl = document.getElementById('strength');

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  // Verify token first
  if (!token) {
    loading.style.display = 'none';
    expiredBlock.style.display = 'block';
    emailHint.textContent = 'Link không có token.';
  } else {
    fetch(API_BASE + '/auth/verify-reset-token/' + encodeURIComponent(token))
      .then(r => r.json())
      .then(data => {
        loading.style.display = 'none';
        if (data.valid) {
          form.style.display = 'block';
          emailHint.textContent = 'Đặt mật khẩu mới cho: ' + data.email;
        } else {
          expiredBlock.style.display = 'block';
          const reason = data.reason === 'expired' ? 'hết hạn' : data.reason === 'used' ? 'đã được dùng' : 'không hợp lệ';
          emailHint.textContent = 'Link ' + reason + '.';
        }
      })
      .catch(() => {
        loading.style.display = 'none';
        expiredBlock.style.display = 'block';
        emailHint.textContent = 'Không kết nối được máy chủ.';
      });
  }

  // Password strength
  password.addEventListener('input', () => {
    const val = password.value;
    if (val.length === 0) { strengthEl.textContent = ''; return; }
    if (val.length < 6) { strengthEl.textContent = '⚠️ Quá ngắn'; strengthEl.className = 'password-strength weak'; }
    else if (val.length < 10) { strengthEl.textContent = 'OK — dài hơn tốt hơn'; strengthEl.className = 'password-strength medium'; }
    else if (val.length < 14) { strengthEl.textContent = '✅ Tốt'; strengthEl.className = 'password-strength strong'; }
    else { strengthEl.textContent = '✅ Rất mạnh'; strengthEl.className = 'password-strength strong'; }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';

    const pw = password.value;
    const cf = confirm.value;

    if (pw !== cf) {
      showMsg('Mật khẩu xác nhận không khớp.', 'error');
      return;
    }
    if (pw.length < 6) {
      showMsg('Mật khẩu tối thiểu 6 ký tự.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Đang lưu...';

    try {
      const res = await fetch(API_BASE + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: pw }),
      });
      const data = await res.json();

      if (res.ok && data.success) {
        showMsg('✅ Mật khẩu đã đặt lại. Đang chuyển sang trang đăng nhập...', 'success');
        setTimeout(() => { location.href = '/dang-nhap/'; }, 2000);
      } else {
        showMsg(data.message || 'Có lỗi. Thử lại.', 'error');
        btn.disabled = false;
        btn.textContent = 'Đặt mật khẩu mới →';
      }
    } catch (err) {
      showMsg('Không kết nối được máy chủ.', 'error');
      btn.disabled = false;
      btn.textContent = 'Đặt mật khẩu mới →';
    }
  });
})();
</script>
</body>
</html>
