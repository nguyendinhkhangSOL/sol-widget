# =================================================================
# Nginx config cho bothuocla.sol.vn — v3 (Dashboard SPA + Backend)
# Install:
#   sudo cp nginx-bothuocla-sol-vn-v3.conf /etc/nginx/sites-enabled/bothuocla.sol.vn
#   sudo nginx -t && sudo systemctl reload nginx
#
# Changes vs v2 (multi-location):
#   - BỎ Next.js proxy (port 3000) — đã pm2 delete sol-widget
#   - Dashboard SPA serve trực tiếp từ root /
#   - Chỉ 2 location nhóm: /api/* (proxy backend) + / (static SPA)
# =================================================================

server {
    listen 80;
    listen [::]:80;
    server_name bothuocla.sol.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bothuocla.sol.vn;

    ssl_certificate /etc/letsencrypt/live/bothuocla.sol.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bothuocla.sol.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/bothuocla-sol-vn;
    index index.html;

    client_max_body_size 10M;

    # === 1. BACKEND API (priority cao nhất, đặt trước /) ===

    # Zalo OA webhook — exact match priority cao nhất, raw body
    location = /api/zalo/webhook {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO upgrade (real-time chat)
    location /api/socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Tất cả /api/* khác → Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # === 2. DASHBOARD SPA static ===

    # Vite hashed assets — cache 1 năm
    location ~ ^/assets/.*\.(js|css|woff2|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: route lạ (như /journey, /settings) → index.html
    # React Router sẽ handle client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === Security headers ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # === Performance ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # === Logs ===
    access_log /var/log/nginx/bothuocla-access.log;
    error_log /var/log/nginx/bothuocla-error.log warn;
}
