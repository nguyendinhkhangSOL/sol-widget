# =================================================================
# Nginx config — admin.sol.vn (Sol Admin SPA — Day 8)
# Install:
#   sudo cp nginx-admin-sol-vn.conf /etc/nginx/sites-enabled/admin.sol.vn
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   1. DNS Cloudflare: A record admin.sol.vn → 103.72.57.11 (DNS-only xám)
#   2. Backend đã có CORS_ORIGINS chứa https://admin.sol.vn
#   3. Certbot SSL: sudo certbot --nginx -d admin.sol.vn (chạy 1 lần)
# =================================================================

server {
    listen 80;
    listen [::]:80;
    server_name admin.sol.vn;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.sol.vn;

    # Certbot sẽ thêm 2 line này tự động
    ssl_certificate /etc/letsencrypt/live/admin.sol.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.sol.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/admin-sol-vn;
    index index.html;

    # IP allowlist Khang (uncomment + thêm IP cố định nếu muốn bảo mật cao)
    # allow 222.254.21.0/24;       # IP nhà Khang
    # allow 103.x.x.x;             # IP văn phòng
    # deny all;

    # Cache aggressive cho Vite hashed assets
    location ~ ^/assets/.*\.(js|css|woff2|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — React Router handle client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (stricter cho admin)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    access_log /var/log/nginx/admin-sol-vn-access.log;
    error_log /var/log/nginx/admin-sol-vn-error.log warn;
}
