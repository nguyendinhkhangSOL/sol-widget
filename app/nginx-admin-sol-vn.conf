# =================================================================
# Nginx config cho admin.sol.vn — Sol Admin Panel
# Install:
#   sudo cp /var/www/sol-widget/nginx-admin-sol-vn.conf /etc/nginx/sites-enabled/admin.sol.vn
#   sudo nginx -t && sudo systemctl reload nginx
# =================================================================

server {
    listen 80;
    listen [::]:80;
    server_name admin.sol.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.sol.vn;

    # SSL cert sẽ được tạo bởi Certbot — ban đầu cần cert tạm:
    # sudo certbot --nginx -d admin.sol.vn --email nguyendinhkhang@gmail.com --agree-tos --non-interactive --redirect
    ssl_certificate /etc/letsencrypt/live/admin.sol.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.sol.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy to Sol Widget Next.js (same port 3000 as bothuocla.sol.vn)
    # Middleware sẽ check Host header và rewrite /X → /admin/X
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static Next.js files — cache aggressive
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Security headers (stricter cho admin)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # Logs riêng cho admin
    access_log /var/log/nginx/admin-sol-vn-access.log;
    error_log /var/log/nginx/admin-sol-vn-error.log warn;

    # Optional: IP allowlist cho admin (uncomment + thêm IP văn phòng Khang)
    # allow 222.254.21.0/24;       # vd: IP nhà Khang
    # allow 103.x.x.x;             # vd: IP văn phòng
    # deny all;
}
