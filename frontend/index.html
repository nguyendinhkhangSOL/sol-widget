<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Zalo Platform domain verification — phải đặt sớm trong <head>
         (Zalo crawl 512kb đầu trang). Cấp cho domain bothuocla.sol.vn /
         sol.vn từ Zalo Developer App. KHÔNG xoá nếu chưa unverify Zalo. -->
    <meta name="zalo-platform-site-verification" content="UFEYTeJR5sb4tvvBfTSgOo_3_6R3jIayDJCt" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta
      name="description"
      content="bothuocla.sol.vn — phòng làm việc của bạn cùng Khang. Đăng nhập để bắt đầu hành trình cai thuốc 30 ngày."
    />
    <!-- Chặn index để tránh cạnh tranh SEO với sol.vn (marketing landing thật).
         App entry này chỉ phục vụ user đã có ý định dùng. -->
    <meta name="robots" content="noindex" />
    <title>bothuocla.sol.vn — Đăng nhập</title>
    <!-- Favicon inline (data URI) để tránh 404 khi chưa upload file thật.
         Khi có brand asset, thay bằng <link rel="icon" href="/favicon.ico" />. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2316a34a'/><text x='16' y='21' font-family='sans-serif' font-size='14' font-weight='bold' fill='white' text-anchor='middle'>S</text></svg>"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-sol-bg">
    <div id="sol-app-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
